# Sirve el frontend compilado. No hace de proxy hacia el API: el navegador llama al backend y a
# Keycloak directamente, en las mismas URL que en desarrollo, y por eso este contenedor no necesita
# conocer a ninguno de los dos.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Es una aplicacion de una sola pagina: una ruta como /equipos/e1/hoja-de-vida no es un fichero.
    # Sin esto, recargar o abrir un enlace directo responde 404, que es justo lo que el router de
    # Angular permite hacer y lo que una hoja de vida imprimible necesita.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los trozos que genera el build llevan un hash en el nombre: cambian de nombre si cambian de
    # contenido, asi que se pueden cachear sin caducidad.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html no lleva hash y es el que apunta a los trozos nuevos: si se cacheara, un despliegue
    # nuevo seguiria cargando la version vieja.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
