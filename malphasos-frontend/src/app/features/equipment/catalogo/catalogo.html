<header class="superficie pb-0">
  <!-- En un telefono el titulo cabe en una linea: a su tamano de escritorio se partia en dos. -->
  <h1 class="titulo-pagina max-md:text-[1.625rem] max-md:leading-tight max-md:whitespace-nowrap">
    Catálogo de equipos
  </h1>
  <p class="mt-1 text-neutral-800">Configuración común a todos los clientes.</p>

  <!--
    Subnavegacion propia de la seccion, ademas del desplegable del menu: una vez dentro, saltar de marcas
    a fabricantes no deberia exigir volver a la cabecera. aria-current lo pone routerLinkActive, no un
    calculo propio. Desde el rediseño cada pestaña dice cuántos hay.

    En un telefono (2026-11-20) las siete van en una sola fila que se desliza de lado, con el numero al
    lado del nombre: envueltas ocupaban cuatro filas antes del contenido. La fila sale hasta los bordes
    del recuadro, y la ultima pestaña cortada en el borde dice que hay mas. Y en escritorio igual
    (2026-11-22, pedido por el usuario): en una ventana estrecha se partian en tres filas, y ahora la
    fila es una sola que se desplaza de lado con su barra.
  -->
  <nav aria-label="Piezas del catálogo" class="mt-2 overflow-x-auto max-md:-mx-3 max-md:px-1.5">
    <ul class="flex list-none flex-nowrap">
      @for (pieza of piezas; track pieza.ruta) {
        <!--
          En escritorio (2026-11-20) las pestañas se reparten todo el ancho del recuadro: cada una crece
          por igual, y sin bajar de su ancho minimo: si no caben, la fila se desplaza.
        -->
        <li class="md:flex-1">
          <a
            class="flex min-h-tactil flex-none items-center gap-0.5 border-b-4 border-transparent px-1.5 whitespace-nowrap text-neutral-800 hover:text-ink md:h-full md:min-w-[7.5rem] md:flex-col md:items-start md:justify-center md:gap-0 md:px-2 md:py-1"
            routerLinkActive="border-accent! bg-neutral-100 font-bold text-ink"
            ariaCurrentWhenActive="page"
            [routerLink]="['/catalogo', pieza.ruta]"
          >
            <span
              class="order-last text-sm font-bold tabular-nums md:order-none md:text-2xl md:leading-none md:font-extrabold"
              >{{ cuantos()[pieza.ruta] || '·' }}</span
            >
            <span class="text-sm">{{ pieza.etiqueta }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</header>

<div class="mt-3">
  <router-outlet />
</div>
