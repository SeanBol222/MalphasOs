<h1 class="text-2xl font-bold">Catálogo de equipos</h1>

<!--
  Subnavegacion propia de la seccion, ademas del desplegable del menu: una vez dentro, saltar de marcas
  a fabricantes no deberia exigir volver a la cabecera. aria-current lo pone routerLinkActive, no un
  calculo propio.
-->
<nav aria-label="Piezas del catálogo" class="mt-2 border-b border-neutral-300">
  <ul class="flex list-none flex-wrap gap-1">
    @for (pieza of piezas; track pieza.ruta) {
      <li>
        <a
          class="flex min-h-tactil items-center border-b-2 border-transparent px-2 font-semibold text-neutral-800 hover:text-ink"
          routerLinkActive="border-accent text-ink"
          ariaCurrentWhenActive="page"
          [routerLink]="['/catalogo', pieza.ruta]"
        >
          {{ pieza.etiqueta }}
        </a>
      </li>
    }
  </ul>
</nav>

<div class="mt-3">
  <router-outlet />
</div>
