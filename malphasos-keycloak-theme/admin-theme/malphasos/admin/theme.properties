# Tema de la consola de administracion de MalphasOS.
#
# NO es un Keycloakify: es un tema clasico de Keycloak, cuatro archivos, y hereda la plantilla de la
# consola real. La alternativa era `npx keycloakify initialize-admin-theme`, que COPIA la consola de
# administracion entera dentro del proyecto -692 archivos, 89.000 lineas, anclados a una version de
# Keycloak- para poder editarla. Para cambiar el logo y los colores eso es desproporcionado, y encima
# hay que reconciliarlo con cada version nueva de Keycloak. Asi, Keycloak actualiza su consola y esto
# sigue valiendo.
#
# Lo que este camino NO permite, y conviene saberlo antes de pedirlo: cambiar la disposicion de la
# consola, sus componentes o sus textos. Para eso si habria que copiarla.

# La plantilla de la consola de verdad, la que lee estas propiedades. Vive en
# org.keycloak.keycloak-admin-ui-<version>.jar, en theme/keycloak.v2/admin/index.ftl, y es donde se
# comprobo -leyendola, no de memoria- que `logo`, `logoUrl`, `favIcon`, `title` y `styles` existen.
parent=keycloak.v2

# El logo del masthead. La plantilla lo pasa a la aplicacion de la consola tal cual, y esta lo resuelve
# contra la URL de recursos del tema: de ahi la barra inicial.
logo=/img/malphasos-horizontal.png

# A donde lleva pulsar el logo. Se deja en la propia consola: mandar a otro sitio desde el logo es la
# clase de sorpresa que nadie agradece.
logoUrl=/admin/master/console/

# La plantilla concatena `resourceUrl` + esto, asi que aqui SI va la barra inicial.
favIcon=/img/malphasos-icon.png
favIconType=image/png

# Lo que se lee en la pestana del navegador. Por defecto dice «Keycloak Administration Console».
title=MalphasOS · Administracion

# Sin barra inicial: la plantilla ya pone la suya -${resourceUrl}/${style}-.
styles=css/malphasos-admin.css
