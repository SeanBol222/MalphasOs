<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-6093832a-d30f-42b7-9be5-3e40bdfaae43/styles.css">
</helmet>
<div style="min-height:100vh; background:var(--color-bg); padding:64px 40px; display:flex; flex-direction:column; align-items:center; gap:56px;">

  <div style="text-align:left; width:100%; max-width:1100px; border-bottom:2px solid var(--color-text); padding-bottom:16px;">
    <h6 style="color:var(--color-accent); margin:0 0 8px;">Identidad de marca</h6>
    <h2 style="margin:0;">MalphasOS</h2>
    <p class="text-muted" style="margin:8px 0 0; font-size:14px;">Gestión de mantenimiento</p>
  </div>

  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:0; max-width:1100px; width:100%; border:2px solid var(--color-text);">

    <div style="flex:1; min-width:220px; display:flex; flex-direction:column; align-items:center; gap:16px; padding:32px; border-right:2px solid var(--color-text);">
      <div id="export-icon" style="width:132px; height:132px; background:var(--color-neutral-900); display:flex; align-items:center; justify-content:center;">
        <span style="font-family:var(--font-heading); font-weight:700; font-size:64px; color:var(--color-bg); letter-spacing:-0.02em;">M</span>
      </div>
      <span style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-text); opacity:0.6; align-self:flex-start;">Ícono de app</span>
    </div>

    <div style="flex:2; min-width:340px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:16px; padding:32px; border-right:2px solid var(--color-text);">
      <div id="export-horizontal" style="display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:16px;">
        <div style="font-family:var(--font-heading); font-weight:700; font-size:44px; letter-spacing:-0.01em; line-height:1;">
          <span style="color:var(--color-text);">Malphas</span><span style="color:var(--color-accent);">OS</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:22px; height:2px; background:var(--color-accent); display:inline-block;"></span>
          <span style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-text); opacity:0.6;">Gestión de mantenimiento</span>
        </div>
      </div>
      <span style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-text); opacity:0.6; align-self:flex-start;">Logo horizontal</span>
    </div>

    <div style="flex:1; min-width:220px; display:flex; flex-direction:column; align-items:center; gap:16px; padding:32px;">
      <div id="export-stacked" style="display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px;">
        <div style="width:60px; height:60px; background:var(--color-neutral-900); display:flex; align-items:center; justify-content:center;">
          <span style="font-family:var(--font-heading); font-weight:700; font-size:30px; color:var(--color-bg);">M</span>
        </div>
        <div style="font-family:var(--font-heading); font-weight:700; font-size:28px; letter-spacing:-0.01em; line-height:1; text-align:center;">
          <span style="color:var(--color-text);">Malphas</span><span style="color:var(--color-accent);">OS</span>
        </div>
        <span style="font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-text); opacity:0.55;">Gestión de mantenimiento</span>
      </div>
      <span style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-text); opacity:0.6; align-self:flex-start;">Logo apilado</span>
    </div>

  </div>

  <div style="display:flex; flex-direction:column; align-items:flex-start; gap:16px; width:420px;">
    <div id="export-dark" style="width:100%; height:150px; background:var(--color-neutral-900); display:flex; align-items:center; justify-content:center;">
      <div style="font-family:var(--font-heading); font-weight:700; font-size:40px; letter-spacing:-0.01em;">
        <span style="color:var(--color-bg);">Malphas</span><span style="color:var(--color-accent);">OS</span>
      </div>
    </div>
    <span style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-text); opacity:0.6;">Versión sobre fondo oscuro</span>
  </div>

</div>

</x-dc>
</body>
</html>
