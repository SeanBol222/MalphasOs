# Nombre del proyecto de Docker Compose: agrupa contenedores, red y volumenes bajo
# una misma etiqueta, de modo que `docker compose ls` y la UI de Docker los muestran
# como una sola unidad y no dependen del nombre del directorio.
name: malphasos

services:
  postgres:
    container_name: malphasos-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - malphasos-postgres-data:/var/lib/postgresql/data
      # Solo crea la base de datos que consume Keycloak.
      # El esquema de la aplicacion lo gestiona Flyway desde el backend,
      # no scripts de initdb (que solo corren al crear el volumen).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    container_name: malphasos-keycloak
    # Se construye en vez de usarse la imagen tal cual, porque lleva dentro el tema de
    # MalphasOS: el JAR se arma en una etapa con Node y Maven y se copia a providers/.
    # La version de Keycloak la fija ese Dockerfile y tiene que seguir siendo la misma.
    build:
      context: ./malphasos-keycloak-theme
      dockerfile: Dockerfile
    image: malphasos-keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KC_HOST_PORT}:8080"
    volumes:
      # Keycloak 26 (Quarkus) importa los realms desde esta ruta con --import-realm.
      # La variable KEYCLOAK_IMPORT del proyecto original es de la era WildFly y se ignora.
      #
      # ⚠️ --import-realm USA LA ESTRATEGIA «IGNORE_EXISTING», y esto ya costo un rato: si el realm
      # existe en la base, el archivo NO se aplica y el arranque lo dice en una linea de INFO que se
      # pierde entre cien -«Realm 'malphasos-realm' already exists. Import skipped»-. O sea que editar
      # el JSON versionado no cambia nada en un entorno ya levantado, y no falla: simplemente no pasa.
      #
      # Para aplicar un cambio suelto sin perder los usuarios de desarrollo, va por kcadm:
      #   docker exec malphasos-keycloak /opt/keycloak/bin/kcadm.sh config credentials \
      #     --server http://localhost:8080 --realm master --user "$KC_ADMIN_USER" --password "..."
      #   docker exec malphasos-keycloak /opt/keycloak/bin/kcadm.sh update realms/malphasos-realm \
      #     -s loginTheme=malphasos
      #
      # Borrar el volumen de Postgres tambien reimporta, pero se lleva por delante todo lo creado a mano.
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  rabbitmq:
    container_name: malphasos-rabbitmq
    image: rabbitmq:4.1.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT}:15672"
    volumes:
      - malphasos-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # El backend. Aplica sus migraciones de Flyway al arrancar, y eso incluye V7, que siembra los 249
  # paises y las 1.350 ciudades: una instalacion nueva tiene desde el primer arranque lo que hace falta
  # para registrar un fabricante o abrir una sede, sin un paso manual.
  #
  # No hay nada que anadir aqui para conseguirlo, y conviene saber por que no se hizo de otra forma:
  # un script en docker/postgres/init solo se ejecuta al CREAR el volumen, de modo que no habria tocado
  # una base de datos que ya existe -como la de este equipo- y no volveria a correr nunca.
  app:
    container_name: malphasos-app
    build:
      context: ./malphasos
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      # Dentro de la red de Docker los servicios se alcanzan por su nombre, no por
      # localhost, y siempre en su puerto interno.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      # El emisor es la URL publica, la que el navegador ve y Keycloak escribe en el token.
      KEYCLOAK_ISSUER_URI: http://${KC_HOSTNAME}:${KC_HOST_PORT}/realms/${KC_REALM:-malphasos-realm}
      # Las claves de firma se descargan por la red interna, donde si se alcanza al servicio.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KC_REALM:-malphasos-realm}/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KC_REALM:-malphasos-realm}
      KEYCLOAK_CLIENT_ID: malphasos-api
      # El origen del navegador que llama al API. Se declara aqui y no se hereda del
      # application.yaml a proposito: el contenedor es lo que se despliega, y donde se sirve el
      # frontend es una decision del despliegue, no del codigo.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      KEYCLOAK_ADMIN_CLIENT_ID: malphasos-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${MALPHASOS_BACKEND_ADMIN_SECRET:-}
    ports:
      - "${APP_HOST_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Solo para desarrollo: inspeccion visual de la base de datos.
  # Levantalo con: docker compose --profile tools up -d
  pgadmin:
    container_name: malphasos-pgadmin
    image: dpage/pgadmin4
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped

volumes:
  malphasos-postgres-data:
    name: malphasos-postgres-data
  malphasos-rabbitmq-data:
    name: malphasos-rabbitmq-data

networks:
  malphasos-network:
    name: malphasos-network
    driver: bridge
