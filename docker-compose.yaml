# Nombre del proyecto de Docker Compose: agrupa contenedores, red y volumenes bajo
# una misma etiqueta, de modo que `docker compose ls` y la UI de Docker los muestran
# como una sola unidad y no dependen del nombre del directorio.
name: malphasos

services:
  postgres:
    container_name: malphasos-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - malphasos-postgres-data:/var/lib/postgresql/data
      # Solo crea la base de datos que consume Keycloak.
      # El esquema de la aplicacion lo gestiona Flyway desde el backend,
      # no scripts de initdb (que solo corren al crear el volumen).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    container_name: malphasos-keycloak
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KC_HOST_PORT}:8080"
    volumes:
      # Keycloak 26 (Quarkus) importa los realms desde esta ruta con --import-realm.
      # La variable KEYCLOAK_IMPORT del proyecto original es de la era WildFly y se ignora.
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  rabbitmq:
    container_name: malphasos-rabbitmq
    image: rabbitmq:4.1.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT}:15672"
    volumes:
      - malphasos-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    container_name: malphasos-app
    build:
      context: ./malphasos
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      # Dentro de la red de Docker los servicios se alcanzan por su nombre, no por
      # localhost, y siempre en su puerto interno.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      # El emisor es la URL publica, la que el navegador ve y Keycloak escribe en el token.
      KEYCLOAK_ISSUER_URI: http://${KC_HOSTNAME}:${KC_HOST_PORT}/realms/${KC_REALM:-malphasos-realm}
      # Las claves de firma se descargan por la red interna, donde si se alcanza al servicio.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KC_REALM:-malphasos-realm}/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KC_REALM:-malphasos-realm}
      KEYCLOAK_CLIENT_ID: malphasos-api
      KEYCLOAK_ADMIN_CLIENT_ID: malphasos-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${MALPHASOS_BACKEND_ADMIN_SECRET:-}
    ports:
      - "${APP_HOST_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Solo para desarrollo: inspeccion visual de la base de datos.
  # Levantalo con: docker compose --profile tools up -d
  pgadmin:
    container_name: malphasos-pgadmin
    image: dpage/pgadmin4
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - malphasos-network
    restart: unless-stopped

volumes:
  malphasos-postgres-data:
    name: malphasos-postgres-data
  malphasos-rabbitmq-data:
    name: malphasos-rabbitmq-data

networks:
  malphasos-network:
    name: malphasos-network
    driver: bridge
