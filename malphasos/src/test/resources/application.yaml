# Configuracion de las pruebas. Sombrea por completo al application.yaml principal, de modo que
# ninguna prueba herede por accidente los valores de desarrollo ni acabe escribiendo en la base
# local: el datasource lo aporta Testcontainers en cada clase que lo necesita.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Sin issuer-uri configurado: definirlo obligaria a tener Keycloak en marcha para poder ejecutar
  # las pruebas, porque Spring consulta al emisor durante el arranque.

# La comprobacion de salud de RabbitMQ intenta conectarse a localhost:5672 y en pruebas no hay nadie
# escuchando, de modo que /actuator/health respondia 503 con toda razon. Se apaga aqui, y el motivo no
# es cosmetico: figuraba como la causa sospechada -nunca reproducida- de que la bateria diera dos
# resultados distintos, y una dependencia externa que ninguna prueba usa no tiene por que poder
# influir en el resultado. La causa que SI se demostro era otra, el ayudante unico() de las pruebas,
# corregida el 2026-09-08.
#
# Ninguna prueba se dobla por esto: la que toca /actuator/health solo exige que la seguridad no lo
# bloquee -ni 401 ni 403-, asi que valia con 503 y vale con 200.
management:
  health:
    rabbit:
      enabled: false

app:
  security:
    # Apagada por defecto para que cada prueba se centre en su capa y no en construir tokens. La
    # proteccion de los endpoints se verifica aparte, en SecurityIntegrationTest.
    enabled: false
    client-id: malphasos-api
    cors:
      # El fichero de pruebas NO hereda del de produccion: comparten nombre, y el del classpath de
      # pruebas lo sustituye entero. Sin esta clave el @Value de CorsConfig no resuelve y el
      # contexto no arranca en NINGUNA prueba, seguridad encendida o apagada.
      allowed-origins: http://localhost:5173

keycloak:
  admin:
    # Activo: KeycloakBuilder construye el cliente sin conectarse, de modo que el bean existe sin
    # necesidad de un Keycloak en marcha. Las pruebas que ejercitan la identidad usan dobles.
    enabled: true
    realm: malphasos-realm
    server-url: http://localhost:8080
    client-id: malphasos-backend-admin
    client-secret: irrelevante-en-pruebas
