# El 8080 lo ocupa Keycloak en el docker-compose, que es su puerto convencional;
# el backend escucha en el 8081.
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: malphasos

  # Los valores por defecto apuntan al docker-compose de la raiz del repo, para que
  # el backend arranque en local sin configuracion extra. En otros entornos se
  # sobrescriben con variables de entorno.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:malphasos_db}
    username: ${POSTGRES_USER:malphasos}
    password: ${POSTGRES_PASSWORD:cambiame}

  # Flyway es el unico dueno del esquema. Hibernate nunca lo modifica: solo valida
  # que las entidades JPA coincidan con lo que las migraciones crearon.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    # Evita mantener la sesion de JPA abierta durante el renderizado de la respuesta:
    # obliga a resolver la carga de datos en la capa de aplicacion, no en la web.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:malphasos}
    password: ${RABBITMQ_PASSWORD:cambiame}

  # Resource server. Se declaran dos URL distintas a proposito:
  #
  #   issuer-uri  es la URL PUBLICA del realm, la que Keycloak escribe en el claim "iss" de cada
  #               token. Debe coincidir letra por letra con lo que ve el navegador al autenticarse.
  #   jwk-set-uri es la URL INTERNA desde la que este servicio descarga las claves de firma.
  #
  # En Docker no pueden ser la misma: el navegador llega a Keycloak por localhost y el backend por
  # el nombre del servicio. Al separarlas, las claves se obtienen por la red interna mientras el
  # emisor se sigue validando contra la URL publica. Definir solo issuer-uri obligaria a que ambas
  # coincidieran, que es de donde salen los 401 clasicos al contenerizar Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/malphasos-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/malphasos-realm/protocol/openid-connect/certs}

app:
  security:
    # La API exige token. SecurityConfig es seguro por omision, asi que esta linea solo existe
    # para poder apagarla de forma explicita en desarrollo; ver SecurityDisabledConfig.
    enabled: ${APP_SECURITY_ENABLED:true}
    # Client de Keycloak cuyos roles se leen del claim resource_access del token.
    client-id: ${KEYCLOAK_CLIENT_ID:malphasos-api}

# Cliente administrativo de Keycloak (Admin API), para crear usuarios y asignar roles.
# El cliente se construye sin conectarse: el bean existe aunque Keycloak no este disponible, y solo
# fallan las llamadas reales. Por eso puede quedar activo aun sin el realm creado todavia.
keycloak:
  admin:
    enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:malphasos-realm}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:malphasos-backend-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Actuator: solo se expone health, que es lo que consulta el healthcheck del contenedor.
# El resto de endpoints queda fuera porque revelan informacion interna (beans, configuracion,
# variables de entorno).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Un cliente anonimo solo ve {"status":"UP"}; el desglose por componente (base de datos,
      # RabbitMQ) requiere estar autenticado.
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: INFO
